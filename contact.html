<body class="bg-[#062940]">
    <!-- Contact Section -->
<section class="text-gray-100 body-font bg-[#062940]">
  <div class="container px-5 py-24 mx-auto flex flex-wrap items-center justify-center">
    
    <!-- Heading -->
    <div class="w-full text-center mb-10">
      <h1 class="text-6xl font-bold text-[#4BE4B0]">Contact</h1>
      <p class="mt-4 text-xl text-white">Let's connect and create something truly <span class="text-[#7CFC00] font-semibold">spectacular!</span></p>
    </div>
    
    <!-- Contact Form Container -->
    <div class="lg:w-2/5 md:w-1/2 bg-gray-100 rounded-lg p-8 shadow-lg w-full">
      <h2 class="text-gray-900 text-lg font-medium title-font mb-5">Send a Message</h2>

      <!-- Name Input -->
      <div class="relative mb-4">
        <label for="name" class="leading-7 text-sm text-gray-600">Name</label>
        <input type="text" id="name" name="name"
          class="w-full bg-white rounded border border-gray-300 focus:border-[#4BE4B0] focus:ring-2 focus:ring-[#4BE4B0] text-base outline-none text-gray-700 py-2 px-4 leading-6 transition-colors duration-200 ease-in-out" />
      </div>

      <!-- Email Input -->
      <div class="relative mb-4">
        <label for="email" class="leading-7 text-sm text-gray-600">Email</label>
        <input type="email" id="email" name="email"
          class="w-full bg-white rounded border border-gray-300 focus:border-[#4BE4B0] focus:ring-2 focus:ring-[#4BE4B0] text-base outline-none text-gray-700 py-2 px-4 leading-6 transition-colors duration-200 ease-in-out" />
      </div>

      <!-- Message Input -->
      <div class="relative mb-4">
        <label for="message" class="leading-7 text-sm text-gray-600">Message</label>
        <textarea id="message" name="message" rows="4"
          class="w-full bg-white rounded border border-gray-300 focus:border-[#4BE4B0] focus:ring-2 focus:ring-[#4BE4B0] text-base outline-none text-gray-700 py-2 px-4 leading-6 resize-none transition-colors duration-200 ease-in-out"></textarea>
      </div>

      <!-- Submit Button -->
      <button
        class="text-black bg-white hover:bg-[#7CFC00] border-0 py-2 px-8 focus:outline-none rounded text-lg transition duration-300">
        Send Message
      </button>

      <p class="text-xs text-gray-500 mt-3">I'll get back to you as soon as I can!</p>
    </div>
  </div>
</section>
